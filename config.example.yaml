# 复制到 ~/.upy/config.yaml
# 也可用 UPLY_CONFIG=/path/to/config.yaml 覆盖路径
#
# github.token 优先于环境变量 DEPLOY_GITHUB_TOKEN。
# 通知失败不会让部署失败。没配渠道时静默跳过。

github:
  token: github_pat_xxx

notify:
  bark:
    - name: phone
      serverUrl: https://api.day.app
      token: your-bark-device-key
      group: upy.phone
    # - name: watch
    #   serverUrl: https://api.day.app
    #   deviceKey: another-device-key
    #   sound: minuet
    #   enabled: true
