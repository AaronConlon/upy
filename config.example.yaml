# 复制到 ~/.upy/config.yaml
# 也可用 UPY_CONFIG=/path/to/config.yaml 覆盖路径
# 权限建议设为 600: chmod 600 ~/.upy/config.yaml
#
# 也可通过命令快速配置:
#   upy init <token>              # 设置全局默认 token
#   upy init <owner> <token>      # 设置指定组织或个人的专属 token

# CLI language: en (default) or zh-CN. Web console and notifications are unchanged.
language: en

github:
  # 全局默认 / 兜底 token (可选)
  token: github_pat_default_xxx

  # 按组织名或个人归属的专属 token 映射 (可选)
  # 从对应仓库 (如 WeiaiHealth-Software/app) 拉取资产时会自动匹配对应 token
  tokens:
    WeiaiHealth-Software: github_pat_org_xxx
    AaronConlon: github_pat_personal_xxx

notify:
  bark:
    - name: phone
      serverUrl: https://api.day.app
      token: your-bark-device-key
      group: upy.phone
    # - name: watch
    #   serverUrl: https://api.day.app
    #   deviceKey: another-device-key
    #   sound: minuet
    #   enabled: true

server:
  # 在 VPS 上运行 upy server auth，扫描终端二维码绑定认证器（Web 不提供绑定入口）
  listen: "127.0.0.1:8999"         # Webhook & Web 控制台监听地址 (建议反代模式下绑定 127.0.0.1)
  token: "your-api-secret-token"   # 全局 API 鉴权 Token (CI/CD Webhook 调用时使用)
  totp_max_views: 5                # 2FA 绑定二维码最大展示次数 (默认 5 次，超出即禁止展示)
  # public_url: "https://deploy.example.com" # 生成外部访问日志链接的基础 URL
  # max_log_history: 30            # 每个项目保留的历史日志份数 (默认 30 份)

# upy 自身升级下载加速，默认关闭；不影响项目部署和 GitHub API 查询。
update:
  proxy_enabled: false            # true: 使用 https://ghfast.top 下载二进制与 SHA256SUMS
