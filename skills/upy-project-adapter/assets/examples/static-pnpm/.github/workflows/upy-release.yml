name: upy Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      # 未提供项目测试脚本；集成时在此加入项目已确认的测试命令。
      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/upy/build-bundle.sh "$RELEASE_TAG" artifacts/bundle.zip
      - uses: actions/upload-artifact@v4
        with:
          name: demo-web-bundle
          path: |
            artifacts/bundle.zip
            artifacts/bundle.zip.sha256
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: demo-web-bundle
          path: artifacts
      - name: Verify checksum
        working-directory: artifacts
        run: sha256sum -c bundle.zip.sha256
      # 已有 Release 将导致 create 失败；不覆盖既有版本资产。
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/bundle.zip artifacts/bundle.zip.sha256 --verify-tag --generate-notes

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger upy deployment
        env:
          UPY_WEBHOOK_URL: ${{ secrets.UPY_WEBHOOK_URL }}
          UPY_WEBHOOK_SECRET: ${{ secrets.UPY_WEBHOOK_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$UPY_WEBHOOK_URL"
          test -n "$UPY_WEBHOOK_SECRET"
          payload="$(python3 -c 'import json, os; print(json.dumps({"target": os.environ["RELEASE_TAG"], "force": False}, separators=(",", ":")))')"
          signature="$(printf %s "$payload" | openssl dgst -sha256 -hmac "$UPY_WEBHOOK_SECRET" | sed 's/^.*= //')"
          curl --fail-with-body --silent --show-error --request POST "$UPY_WEBHOOK_URL" \
            --header 'Content-Type: application/json' \
            --header "X-Hub-Signature-256: sha256=$signature" \
            --data "$payload"
