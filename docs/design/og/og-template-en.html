<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background-color: #ffffff;
        color: #111215;
        font-family: 'Jost', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        position: relative;
        overflow: hidden;
      }
      /* Engineering Blueprint Grid */
      .grid-bg {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(17, 18, 21, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(17, 18, 21, 0.05) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      .outer-frame {
        position: absolute;
        inset: 28px;
        border: 1px solid #e1e4e8;
        pointer-events: none;
      }
      .corner-mark {
        position: absolute;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: #111215;
        line-height: 1;
      }
      .top-left { top: 22px; left: 22px; }
      .top-right { top: 22px; right: 22px; }
      .bottom-left { bottom: 22px; left: 22px; }
      .bottom-right { bottom: 22px; right: 22px; }

      .container {
        position: relative;
        z-index: 10;
        display: flex;
        width: 100%;
        height: 100%;
        padding: 56px 64px;
        justify-content: space-between;
        align-items: center;
      }
      .content {
        max-width: 660px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .tagline-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #111215;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        padding: 5px 12px;
        width: fit-content;
        margin-bottom: 24px;
      }
      .brand-title {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        margin-bottom: 16px;
        color: #111215;
      }
      .brand-title span {
        color: #111215;
      }
      .slogan {
        font-size: 28px;
        font-weight: 600;
        line-height: 1.3;
        color: #111215;
        margin-bottom: 28px;
        letter-spacing: -0.01em;
      }
      .pillars {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
      }
      .pillar-item {
        background: #ffffff;
        border: 1px solid #e1e4e8;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 500;
        color: #111215;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pillar-item strong {
        font-family: 'JetBrains Mono', monospace;
        color: #111215;
        font-size: 12px;
      }
      .meta-footer {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: #57606a;
        display: flex;
        gap: 18px;
      }
      .meta-footer span::before {
        content: "•";
        margin-right: 8px;
        color: #111215;
      }
      .meta-footer span:first-child::before {
        content: "";
        margin-right: 0;
      }

      .visual-stage {
        position: relative;
        width: 380px;
        height: 380px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .blueprint-circle {
        position: absolute;
        width: 360px;
        height: 360px;
        border: 1px dashed rgba(17, 18, 21, 0.25);
        border-radius: 50%;
      }
      .blueprint-circle-inner {
        position: absolute;
        width: 280px;
        height: 280px;
        border: 1px solid rgba(17, 18, 21, 0.12);
        border-radius: 50%;
      }
      .mascot-img {
        position: relative;
        z-index: 5;
        width: 340px;
        height: 340px;
        object-fit: contain;
        filter: drop-shadow(0 14px 28px rgba(17, 18, 21, 0.12));
      }
    </style>
  </head>
  <body>
    <div class="grid-bg"></div>
    <div class="outer-frame"></div>
    <div class="corner-mark top-left">+</div>
    <div class="corner-mark top-right">+</div>
    <div class="corner-mark bottom-left">+</div>
    <div class="corner-mark bottom-right">+</div>

    <div class="container">
      <div class="content">
        <div class="tagline-badge">Go Binary // ~8.5MB // Zero Deps</div>
        <h1 class="brand-title">upy<span>.</span></h1>
        <p class="slogan">A single binary, straight from Release to production.</p>
        <div class="pillars">
          <div class="pillar-item"><strong>01</strong> Deploy (SPA & Docker)</div>
          <div class="pillar-item"><strong>02</strong> Clean (Disk Reclaim)</div>
          <div class="pillar-item"><strong>03</strong> Backup (Convention)</div>
        </div>
        <div class="meta-footer">
          <span>github.com/AaronConlon/upy</span>
          <span>Minimal Memory</span>
          <span>Graceful Rollback</span>
        </div>
      </div>
      <div class="visual-stage">
        <div class="blueprint-circle"></div>
        <div class="blueprint-circle-inner"></div>
        <img class="mascot-img" src="../../../website/assets/gopher.png" alt="upy logo" />
      </div>
    </div>
  </body>
</html>
